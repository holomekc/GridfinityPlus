name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: holomekc
          GIT_AUTHOR_EMAIL: 30546982+holomekc@users.noreply.github.com
          GIT_COMMITTER_NAME: holomekc
          GIT_COMMITTER_EMAIL: 30546982+holomekc@users.noreply.github.com
        run: >
          npx --yes
          -p semantic-release@25
          -p @semantic-release/exec@7
          -p @semantic-release/git@10
          -p conventional-changelog-conventionalcommits@9
          semantic-release
